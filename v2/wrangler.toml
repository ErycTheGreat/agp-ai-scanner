name = "agp-scanner-v2"
main = "scanner.mjs"
compatibility_date = "2026-04-14"

# Keep dashboard-only variables when deploying from this file.
keep_vars = true

# LIVE settings (match the dashboard). "dry" = report only, "apply" = write.
[vars]
MODE = "apply"

# Every 6 hours at :30 UTC. v1 (agp-ai-scanner) runs at 00:00 and 12:00 UTC,
# so the two never start at the same moment.
[triggers]
crons = ["30 */6 * * *"]

# Same bindings as v1. No AI and no Browser binding needed.
[[kv_namespaces]]
binding = "AGP_STATE"
id = "9a9985fe64c34f6ea7eb41de408ccbcd"

[[r2_buckets]]
binding = "MY_ASSETS"
bucket_name = "eryc-assets"

[observability]
enabled = true

# Secret (not stored in this file):  npx wrangler secret put AGP_KEY --config v2/wrangler.toml
